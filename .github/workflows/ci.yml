name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Sui Engine - Install Dependencies
      run: npm install

    - name: TypeScript Strict Compilation Audit
      run: npm run audit:types

    - name: Static Performance Anti-Pattern Scanner
      run: npm run perf:detect

    - name: Automated Micro-Benchmarks & P95 Latency Threshold Gates
      run: npm run benchmark:ci

    - name: Full Test Matrix & Adversarial Stress Suites
      run: npx vitest run --fileParallelism=false

